name: Build artifacts

on:
  push:
    branches:
      - "*"

  pull_request:

  workflow_dispatch:

  workflow_call:

# Terminate stale runs early
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Hatch
        uses: pypa/hatch@install
      - name: Test wheel artifact selection
        run: |
          python3 -m pip install hatchling
          python3 -m unittest discover -s package/tests -p test_wheel_build.py
      - run: hatch build -t sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-14
          - macos-15-intel # Intel macOS
          - macos-15 # Native Apple Silicon macOS
          - windows-2022

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2.3.0
        with:
          nim-version: '2.2.10'
          parent-nim-install-directory: ${{ runner.temp }}
          nim-install-directory: nim
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nim dependencies
        working-directory: server
        run: nimble install --depsOnly -y

      - name: Build CLI
        working-directory: server
        run: nimble buildCliCI -d:release -d:lto -d:strip

      - name: Test native socket paths
        shell: bash
        working-directory: server
        run: |
          nim c -r -d:release --hints:off tests/test_write_path.nim
          nim c -r -d:release --hints:off tests/test_receive_unmask.nim

      - name: Smoke test CLI
        shell: bash
        run: |
          for binary in dist/pocketsocket-cli*; do
            "$binary" --version
          done

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.runner }}
          path: dist/pocketsocket-cli*
          if-no-files-found: error

      - name: Test MSVC Winsock compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($platform in @('x86', 'amd64')) {
            $binary = Join-Path $env:RUNNER_TEMP "winsock-compat-$platform.exe"
            $object = Join-Path $env:RUNNER_TEMP "winsock-compat-$platform.obj"
            & vccexe.exe "--platform:$platform" /nologo "/Fe:$binary" "/Fo:$object" server/tests/test_winsock_compat.c
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $binary
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.1

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
