[project]
name = "pocketsocket"
version = "2.0.9"
description = "Zero config websockets"
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
    { name="Strangemother", email="pocketsocket@strangemother.com" }
]

classifiers = [
    "Programming Language :: Python",
]

dependencies = []

[project.scripts]
tool = "utils.tool:main"

[project.optional-dependencies]
# The 'server' extra includes the compiled binary extension
# By default, the wheel already includes the .so/.pyd file,
# so this is mainly for documentation purposes
server = []

# Development dependencies
dev = [
    "hatch",
    "pytest",
    "pytest-cov",
]

[project.urls]
Documentation = "https://github.com/Strangemother/pocketsocket#readme"
Homepage = "https://github.com/Strangemother/pocketsocket"
Repository = "https://github.com/Strangemother/pocketsocket"
Issues = "https://github.com/Strangemother/pocketsocket/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/results",
    "/server/nimcache",
    "/utils/socketspy-poc/output",
    "/package/*.so",
    "/package/*.pyd",
]

[tool.hatch.build.targets.wheel]
packages = [
    "package/pocketsocket",
    "utils",
]
only-include = [
    "package/pocketsocket",
    "utils/__init__.py",
    "utils/tool.py",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "package/hatch_build.py"

# Build the native module inside each cibuildwheel environment so its ABI and
# glibc symbols match the Python interpreter and manylinux image being built.
[tool.cibuildwheel]
skip = "cp*t-*"
before-build = "cd server && nimble buildPyd -d:release -d:lto -d:strip"
environment = { POCKETSOCKET_PYTHON = "python" }
test-requires = ["websockets>=14"]
test-command = "python {project}/package/tests/wheel_smoke.py"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", POCKETSOCKET_PYTHON = "python" }

[tool.cibuildwheel.linux]
environment = { PATH = "$HOME/.nimble/bin:$HOME/.local/share/grabnim/current/bin:$PATH", POCKETSOCKET_PYTHON = "python" }
# Install Nim into the Linux build container.
before-all = [
    "curl https://codeberg.org/janAkali/grabnim/raw/branch/master/misc/install.sh -sSf | sh",
    "grabnim 2.2.10",
    "cd server && nimble install --depsOnly -y"
]
