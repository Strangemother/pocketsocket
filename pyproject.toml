[project]
name = "pocketsocket"
version = "2.0.4"
description = "Zero config websockets"
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
    { name="Strangemother", email="pocketsocket@strangemother.com" }
]

classifiers = [
    "Programming Language :: Python",
]

dependencies = []

[project.optional-dependencies]
# The 'server' extra includes the compiled binary extension
# By default, the wheel already includes the .so/.pyd file,
# so this is mainly for documentation purposes
server = []

# Development dependencies
dev = [
    "hatch",
]

[project.urls]
Documentation = "https://github.com/Strangemother/pocketsocket-2#readme"
Homepage = "https://github.com/Strangemother/pocketsocket-2"
Repository = "https://github.com/Strangemother/pocketsocket-2"
Issues = "https://github.com/Strangemother/pocketsocket-2/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "package/pocketsocket",
]
artifacts = [
    "package/*.pyd", "package/*.so"
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "package/hatch_build.py"

# Build the native module inside each cibuildwheel environment so its ABI and
# glibc symbols match the Python interpreter and manylinux image being built.
[tool.cibuildwheel]
before-build = "cd server && nimble buildPyd -d:release -d:lto -d:strip"

[tool.cibuildwheel.linux]
environment = { PATH = "$HOME/.nimble/bin:$HOME/.local/share/grabnim/current/bin:$PATH" }
# Install Nim into the Linux build container.
before-all = [
    "curl https://codeberg.org/janAkali/grabnim/raw/branch/master/misc/install.sh -sSf | sh",
    "grabnim",
    "cd server && nimble install --depsOnly -y"
]
